name: dlearning

# Local stack: dlearning-api (.NET 10) + dlearning-web (nginx) + Postgres.
# Only the web port is published; nginx proxies /api and /images to the api service.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: dlearning
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - dlearning_pg18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dlearning"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ../../dlearning-api/api
      dockerfile: src/Web.Api/Dockerfile
    environment:
      # Demo: applies EF migrations and seeds the demo user sam / 1 on start.
      ASPNETCORE_ENVIRONMENT: Demo
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__MainReadWrite: Host=postgres;Port=5432;Database=dlearning;Username=postgres;Password=postgres
      # Required, no default. deploy/.env (gitignored): DLEARNING_ENCRYPTION_KEY=$(openssl rand -base64 32)
      Encryption__Key: ${DLEARNING_ENCRYPTION_KEY:?set DLEARNING_ENCRYPTION_KEY in deploy/.env}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ../../dlearning-web
    ports:
      - "${DLEARNING_WEB_PORT:-8090}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  dlearning_pg18:
